plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'Voltex'
}

// The release file name carries the loader and game version, so it never clashes with the 1.20.1 Forge jar
tasks.named('jar', Jar).configure {
    archiveVersion = "${mod_version}-neoforge-${minecraft_version}"
}

// 1.21.1 runs on Java 21; Gradle downloads JDK 21 by itself (foojay in settings.gradle)
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Dev-only gametests (smoke test of the data, src/gametest by convention); the jar is built from main alone
sourceSets {
    gametest
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // dev smoke test of the data (src/gametest): gradlew runGameTestServer, exits with the number of failed tests
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.gametest
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }
}

neoForge.addModdingDependenciesTo(sourceSets.gametest)
dependencies {
    gametestImplementation sourceSets.main.output
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
}

repositories {
    maven {
        name = "BlameJared Maven (JEI)"
        url = "https://maven.blamejared.com"
    }
    maven {
        name = "KubeJS"
        url = "https://maven.latvian.dev/releases"
        content { includeGroup "dev.latvian.mods" }
    }
    maven {
        name = "Architectury"
        url = "https://maven.architectury.dev/"
        content { includeGroup "dev.architectury" }
    }
    // AE2 and Jade for 1.21.1 come from the Modrinth maven
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter { includeGroup "maven.modrinth" }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    gametestRuntimeClasspath.extendsFrom localRuntime
}

dependencies {
    // JEI: compile only, not bundled in the jar
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Jade: optional, Jade loads the plugin itself via @WailaPlugin
    compileOnly "maven.modrinth:jade:${jade_version}"

    // AE2: optional, for the ME ports of late multiblocks. The full jar: the pattern port needs PatternContainer outside the API.
    compileOnly "maven.modrinth:ae2:${ae2_version}"
    // dev runs only (smoke test with the ME port recipes): AE2 needs GuideME at runtime
    localRuntime "maven.modrinth:ae2:${ae2_version}"
    localRuntime "maven.modrinth:guideme:21.1.19"

    // KubeJS: optional, recipe schemas
    compileOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
    compileOnly "dev.latvian.mods:rhino:${rhino_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // the port has thousands of errors: 1000 at a time, more than that and the Gradle daemon runs out of memory (OOM)
    options.compilerArgs.addAll(['-Xmaxerrs', '1000'])
}
